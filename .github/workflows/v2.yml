name: PageManager v2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows_native:
    name: Windows native / PostgreSQL 18
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        working-directory: v2
        shell: pwsh
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: v2/requirements-lock.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json
      - name: Install pinned Python dependencies
        run: |
          python -m venv .runtime/ci-venv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $ciPython = Join-Path (Get-Location) '.runtime/ci-venv/Scripts/python.exe'
          & $ciPython -m pip install -r requirements-lock.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $ciPython -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          (Join-Path (Get-Location) '.runtime/ci-venv/Scripts') | Out-File -LiteralPath $env:GITHUB_PATH -Encoding utf8 -Append
          exit $LASTEXITCODE
      - name: Build and test frontend
        working-directory: v2/frontend
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          exit $LASTEXITCODE
      - name: Test shared Graph, Page and Reel behavior with fake data
        working-directory: meta-page-manager
        run: |
          python -m pytest tests/test_graph.py tests/test_service.py tests/test_connection_revisions.py tests/test_secrets.py tests/test_page_management.py tests/test_page_information_status.py tests/test_page_edits.py tests/test_page_bio_read.py tests/test_page_contact_fields.py tests/test_token_reel_inputs.py tests/test_token_reel_assets.py tests/test_token_reel_scheduler.py -q -o asyncio_mode=auto -o asyncio_default_fixture_loop_scope=function
          exit $LASTEXITCODE
      - name: Build Rust gateway with the pinned compiler
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.90.0 test --locked --manifest-path gateway/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.90.0 build --locked --release --manifest-path gateway/Cargo.toml
          exit $LASTEXITCODE
      - name: Prepare official portable PostgreSQL 18
        run: ./scripts/Setup-CI-Postgres.ps1
      - name: Native database, gateway, isolation and SYSTEM startup tests
        run: ./tests/windows_native_smoke.ps1
      - name: Download pinned Windows runtime wheels
        run: |
          python -m pip download --only-binary=:all: -r requirements-lock.txt --dest .runtime/wheelhouse
          exit $LASTEXITCODE
      - name: Package and verify code-only Windows release
        run: |
          python scripts/package_windows.py --gateway gateway/target/release/pagemanager-gateway.exe --wheelhouse .runtime/wheelhouse --output .runtime/releases/PageManager-windows-x64.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bundle = '.runtime/releases/PageManager-windows-x64.zip'
          $hash = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          python scripts/release_bundle.py --bundle $bundle --commit $env:GITHUB_SHA --sha256 $hash
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "$hash  PageManager-windows-x64.zip" | Set-Content -LiteralPath .runtime/releases/SHA256SUMS.txt -Encoding ascii
      - name: Test actual SYSTEM deployment and failed-start rollback
        run: ./tests/windows_deployment_smoke.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PageManager-windows-x64
          path: |
            v2/.runtime/releases/PageManager-windows-x64.zip
            v2/.runtime/releases/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified Windows release
    needs: windows_native
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PageManager-windows-x64
          path: release
      - name: Publish the code-only release after all Windows tests succeed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "windows-$env:GITHUB_SHA" --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Existing immutable release retained.'; exit 0 }
          $hash = (Get-FileHash -LiteralPath release/PageManager-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @{format=1;repository=$env:GITHUB_REPOSITORY;branch='main';event='push';workflow='.github/workflows/v2.yml';commit=$env:GITHUB_SHA;sha256=$hash;run_id=[long]$env:GITHUB_RUN_ID} |
            ConvertTo-Json | Set-Content -LiteralPath release/production-release.json -Encoding utf8
          gh release create "windows-$env:GITHUB_SHA" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --latest --title "Windows $env:GITHUB_SHA" --notes 'Verified native Windows release. Application code, offline Python wheels and checksums only.' release/PageManager-windows-x64.zip release/SHA256SUMS.txt release/production-release.json
          exit $LASTEXITCODE
