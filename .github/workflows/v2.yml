name: PageManager v2
on: [push, pull_request]
jobs:
  codespaces:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build Codespaces image and features
        run: npx --yes @devcontainers/cli@0.83.3 build --workspace-folder .
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: pagemanager_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: disposable-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U testuser -d pagemanager_test" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: v2
    env:
      DATABASE_URL: postgresql://testuser:disposable-test-only@127.0.0.1:5432/pagemanager_test
      PM_TEST_DATABASE_URL: postgresql://testuser:disposable-test-only@127.0.0.1:5432/pagemanager_test
      PM_INTERNAL_KEY: ci-only-internal-key-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      PM_ENCRYPTION_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      PM_DATA_DIR: /tmp/pm-v2-ci
      PM_PUBLIC_ORIGIN: http://127.0.0.1:8020
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.90.0'}
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/test_worker.py tests/test_server.py -q
      - run: cargo build --locked --manifest-path gateway/Cargo.toml
      - run: npm ci && npm test && npm run build
        working-directory: v2/frontend
      - name: Verify Rust gateway and 20 simultaneous sessions
        run: |
          python -m uvicorn tests.runtime_server:app --host 127.0.0.1 --port 8021 --no-access-log > /tmp/pm-worker.log 2>&1 &
          WORKER_PID=$!
          ./gateway/target/debug/pagemanager-gateway > /tmp/pm-gateway.log 2>&1 &
          GATEWAY_PID=$!
          trap 'kill "$WORKER_PID" "$GATEWAY_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8020/healthz; then break; fi
            sleep 1
          done
          PM_TEST_GATEWAY_URL=http://127.0.0.1:8020 python -m pytest tests/test_gateway.py -q
      - name: Verify production containers with fresh PostgreSQL 18
        env:
          POSTGRES_PASSWORD: ci-disposable-container-password-only
        run: |
          trap 'docker compose --project-name pm-v2-ci down --volumes' EXIT
          docker compose --project-name pm-v2-ci up -d --build --wait --wait-timeout 300
          curl --fail --silent http://127.0.0.1:8020/healthz
          ACCOUNTS=$(docker compose --project-name pm-v2-ci exec -T postgres psql -U pagemanager -d pagemanager -tAc 'SELECT COUNT(*) FROM pm_users')
          test "$ACCOUNTS" = 20
      - name: Verify 24-hour server packaging and backup recovery
        run: |
          bash -n server/install-docker.sh
          python - <<'PY'
          from pathlib import Path
          from server.manager import unit_files
          destination=Path('/tmp/pagemanager-server-units');destination.mkdir()
          for name,body in unit_files(Path('server/manager.py').resolve(),Path('/tmp/pm-server-ci.env')).items():
              (destination/name).write_text(body)
          PY
          systemd-analyze verify --man=no /tmp/pagemanager-server-units/*.service /tmp/pagemanager-server-units/*.timer
          sudo python3 server/manager.py --env-file /tmp/pm-server-ci.env init
          COMPOSE=(sudo docker compose --env-file /tmp/pm-server-ci.env --project-name pagemanager-server -f server/compose.yml)
          trap '"${COMPOSE[@]}" down --volumes' EXIT
          "${COMPOSE[@]}" config --quiet
          "${COMPOSE[@]}" up -d --build --wait --wait-timeout 300
          sudo python3 tests/server_container_smoke.py
          sudo python3 server/manager.py --env-file /tmp/pm-server-https-ci.env init --origin https://pages.example.com
          sudo docker compose --env-file /tmp/pm-server-https-ci.env -f server/compose.yml config --quiet
          docker run --rm -e PM_HOSTNAME=pages.example.com -v "$PWD/server/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
